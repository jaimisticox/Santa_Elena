<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hacienda Santa Elena</title>
<meta name="theme-color" content="#0d5b63">
<meta name="description" content="Administración de la casa compartida: cuotas, estadías, luz y agua.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Santa Elena">
<style>
  :root { --teal: #0d5b63; --sand: #e9c46a; --ink: #e3ecee; --mut: #9fcfd4; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--teal); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px)); }
  img { width: 112px; height: 112px; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; }
  p { margin: 0; color: var(--mut); font-size: 14px; max-width: 30em; line-height: 1.45; }
  .spin { width: 30px; height: 30px; border: 3px solid rgba(255, 255, 255, .25); border-top-color: var(--sand); border-radius: 50%; animation: g 1s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
  a.btn { display: inline-block; background: var(--sand); color: #1b2a2e; font-weight: 700; text-decoration: none; padding: 12px 18px; border-radius: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <h1>Hacienda Santa Elena</h1>
  <div class="spin" id="spin" aria-label="Abriendo"></div>
  <p id="msg">Abriendo la app…</p>
  <a class="btn" id="abrir" hidden>Abrir la app</a>
</main>
<script>
  // Pega aquí el enlace /exec de tu aplicación web de Apps Script
  const APP_URL = 'https://script.google.com/macros/s/AKfycbyX0qYxZu8rHSxKW18c0xhxYjlB5EuY329SJ7gu75SagXy7B7AJrXyTXdtT6arq8hsl/exec';

  // La app de Google se abre directamente (no dentro de esta página): así Google reconoce tu sesión
  // aunque el navegador bloquee las cookies de otros sitios.
  const $ = id => document.getElementById(id);
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) {
    $('spin').hidden = true;
    $('msg').textContent = 'Falta configurar el enlace de la app. Edita index.html y pega en APP_URL el enlace /exec de Apps Script.';
  } else {
    $('abrir').href = APP_URL;
    // Si el teléfono no abre solo, a los 4 s aparece un botón para abrir a mano
    setTimeout(() => { $('spin').hidden = true; $('msg').textContent = 'Si la app no se abrió sola, tócala aquí:'; $('abrir').hidden = false; }, 4000);
    location.replace(APP_URL);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
